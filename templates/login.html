{% extends "layout.html" %}

{% block title %}লগইন - ই-কমার্স স্টোর{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2>🔐 লগইন করুন</h2>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">ব্যবহারকারী নাম:</label>
                <input type="text" id="username" name="username" required class="form-input">
            </div>

            <div class="form-group">
                <label for="password">পাসওয়ার্ড:</label>
                <input type="password" id="password" name="password" required class="form-input">
            </div>

            <button type="submit" class="btn btn-primary btn-block">লগইন করুন</button>
        </form>

        <p class="auth-link">নতুন ব্যবহারকারী? <a href="{{ url_for('register') }}">এখানে রেজিস্টার করুন</a></p>

        <div class="demo-credentials">
            <h4>📌 ডেমো ক্রেডেনশিয়ালস:</h4>
            <p><strong>এডমিন:</strong> admin / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
