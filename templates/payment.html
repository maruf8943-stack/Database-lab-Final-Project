{% extends "layout.html" %}

{% block title %}Payment - E-Commerce Store{% endblock %}

{% block content %}
<div class="payment-container">
    <div class="payment-form">
        <h2>Payment</h2>

        <div class="alert alert-info">
            This is a demo application. No real payment will be charged.
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label>Card Number:</label>
                <input type="text" placeholder="1234 5678 9012 3456" class="form-input" maxlength="19">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Expiration Date:</label>
                    <input type="text" placeholder="MM/YY" class="form-input" maxlength="5">
                </div>
                <div class="form-group">
                    <label>CVV:</label>
                    <input type="text" placeholder="123" class="form-input" maxlength="3">
                </div>
            </div>

            <div class="form-group">
                <label>Cardholder Name:</label>
                <input type="text" placeholder="Your Name" class="form-input">
            </div>

            <button type="submit" class="btn btn-success btn-block">Complete Payment</button>
        </form>

        <a href="{{ url_for('cart') }}" class="btn btn-secondary btn-block">Back to Cart</a>
    </div>
</div>

<script>
document.getElementById('paymentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    fetch('{{ url_for("process_payment") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        }
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            alert('Payment successful. Order #' + data.order_id);
            window.location.href = '{{ url_for("index") }}';
        } else {
            alert('Payment failed: ' + data.message);
        }
    });
});
</script>
{% endblock %}
