{% extends "layout.html" %}

{% block title %}পেমেন্ট - ই-কমার্স স্টোর{% endblock %}

{% block content %}
<div class="payment-container">
    <div class="payment-form">
        <h2>💳 পেমেন্ট করুন</h2>

        <div class="alert alert-info">
            ⚠️ এটি একটি ডেমো অ্যাপ্লিকেশন। কোনো প্রকৃত অর্থ চার্জ করা হবে না।
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label>কার্ড নম্বর:</label>
                <input type="text" placeholder="1234 5678 9012 3456" class="form-input" maxlength="19">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>মেয়াদ শেষের তারিখ:</label>
                    <input type="text" placeholder="MM/YY" class="form-input" maxlength="5">
                </div>
                <div class="form-group">
                    <label>CVV:</label>
                    <input type="text" placeholder="123" class="form-input" maxlength="3">
                </div>
            </div>

            <div class="form-group">
                <label>কার্ডধারীর নাম:</label>
                <input type="text" placeholder="আপনার নাম" class="form-input">
            </div>

            <button type="submit" class="btn btn-success btn-block">✅ পেমেন্ট সম্পন্ন করুন</button>
        </form>

        <a href="{{ url_for('cart') }}" class="btn btn-secondary btn-block">← কার্টে ফিরুন</a>
    </div>
</div>

<script>
document.getElementById('paymentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    fetch('{{ url_for("process_payment") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        }
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            alert('✅ পেমেন্ট সফল! অর্ডার #' + data.order_id);
            window.location.href = '{{ url_for("index") }}';
        } else {
            alert('❌ পেমেন্ট ব্যর্থ: ' + data.message);
        }
    });
});
</script>
{% endblock %}
