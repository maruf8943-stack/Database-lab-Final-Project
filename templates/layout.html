<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Commerce Store{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="{{ url_for('index') }}">E-Commerce Store</a>
            </div>
            <div class="nav-menu">
                {% if session.get('user_id') %}
                    {% if session.get('is_admin') %}
                        <a href="{{ url_for('admin_dashboard') }}" class="nav-link">Admin Panel</a>
                    {% else %}
                        <a href="{{ url_for('index') }}" class="nav-link">Home</a>
                        <a href="{{ url_for('cart') }}" class="nav-link">Cart</a>
                    {% endif %}
                    <a href="{{ url_for('logout') }}" class="nav-link logout">Logout</a>
                    <span class="username">{{ session.get('username') }}</span>
                {% else %}
                    <a href="{{ url_for('login') }}" class="nav-link">Login</a>
                    <a href="{{ url_for('register') }}" class="nav-link register">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>

  
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
